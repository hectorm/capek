# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json
name: "capek"

services:
  traefik:
    extends:
      file: "./compose.base.yaml"
      service: "traefik"
    networks:
      external:
      internal:
        aliases:
          - "capek.internal"
          - "idp.internal"

  capek:
    extends:
      file: "./compose.base.yaml"
      service: "capek"
    networks:
      - "external"
      - "internal"
    environment:
      NUXT_AUTH_MODE: "oidc"
      NUXT_OIDC_ROOT_URL: "https://capek.localhost"
      NUXT_OIDC_ISSUER: "https://idp.localhost"
      NUXT_OIDC_AUTHORIZATION_ENDPOINT: "https://idp.localhost/authorize"
      NUXT_OIDC_TOKEN_ENDPOINT: "https://idp.internal/token"
      NUXT_OIDC_USERINFO_ENDPOINT: "https://idp.internal/userinfo"
      NUXT_OIDC_END_SESSION_ENDPOINT: "https://idp.localhost/end-session"
      NUXT_OIDC_JWKS_URI: "https://idp.internal/jwks"
      NUXT_OIDC_REDIRECT_URI: "https://capek.localhost/api/login/callback"
      NUXT_OIDC_CLIENT_ID: "capek"
      NUXT_OIDC_CLIENT_SECRET: "ourclientbythesewordsguarded"
      NUXT_OIDC_SCOPES: "openid email profile groups"
      NUXT_OIDC_SYNC_ROLES: "true"
      NUXT_OIDC_SYNC_GROUPS: "true"
    depends_on:
      postgres:
        condition: "service_healthy"
      postgres-setup:
        condition: "service_completed_successfully"

  simpleidp:
    image: "localhost/simpleidp:latest"
    pull_policy: "build"
    build: { context: "https://github.com/hectorm/simpleidp.git#master" }
    container_name: "capek-simpleidp"
    hostname: "simpleidp"
    labels:
      traefik.enable: "true"
      traefik.http.routers.simpleidp.rule: "Host(`idp.localhost`) || Host(`idp.internal`)"
      traefik.http.routers.simpleidp.entryPoints: "websecure"
      traefik.http.routers.simpleidp.tls: "true"
      traefik.http.routers.simpleidp.service: "simpleidp@docker"
      traefik.http.services.simpleidp.loadBalancer.server.port: "8227"
    restart: "always"
    networks:
      - "internal"
    environment:
      SIMPLE_IDP_LISTEN: ":8227"
      SIMPLE_IDP_ISSUER: "https://idp.localhost"
      SIMPLE_IDP_TITLE: "ACME"
      SIMPLE_IDP_CLIENT_CAPEK_ID: "capek"
      SIMPLE_IDP_CLIENT_CAPEK_SECRET: "ourclientbythesewordsguarded"
      SIMPLE_IDP_CLIENT_CAPEK_REDIRECT_URL: "https://capek.localhost/api/login/callback http://localhost:3000/api/login/callback"
      SIMPLE_IDP_CLIENT_CAPEK_POST_LOGOUT_REDIRECT_URL: "https://capek.localhost/ http://localhost:3000/"
      SIMPLE_IDP_CLIENT_CAPEK_BACKCHANNEL_LOGOUT_URI: "http://capek:3000/api/logout/backchannel"
      SIMPLE_IDP_CLIENT_CAPEK_BACKCHANNEL_LOGOUT_SESSION_REQUIRED: "true"
      SIMPLE_IDP_USER_ALICE_USERNAME: "alice"
      SIMPLE_IDP_USER_ALICE_PASSWORD: "password"
      SIMPLE_IDP_USER_ALICE_NAME: "Alice Bennett"
      SIMPLE_IDP_USER_ALICE_EMAIL: "alice@localhost"
      SIMPLE_IDP_USER_ALICE_GROUPS: "administrators"
      SIMPLE_IDP_USER_BOB_USERNAME: "bob"
      SIMPLE_IDP_USER_BOB_PASSWORD: "password"
      SIMPLE_IDP_USER_BOB_NAME: "Bob Collins"
      SIMPLE_IDP_USER_BOB_EMAIL: "bob@localhost"
      SIMPLE_IDP_USER_BOB_GROUPS: "administrators"
      SIMPLE_IDP_USER_CAROL_USERNAME: "carol"
      SIMPLE_IDP_USER_CAROL_PASSWORD: "password"
      SIMPLE_IDP_USER_CAROL_NAME: "Carol Davis"
      SIMPLE_IDP_USER_CAROL_EMAIL: "carol@localhost"
      SIMPLE_IDP_USER_CAROL_GROUPS: "finance"
      SIMPLE_IDP_USER_DAN_USERNAME: "dan"
      SIMPLE_IDP_USER_DAN_PASSWORD: "password"
      SIMPLE_IDP_USER_DAN_NAME: "Dan Edwards"
      SIMPLE_IDP_USER_DAN_EMAIL: "dan@localhost"
      SIMPLE_IDP_USER_DAN_GROUPS: "sales"
      SIMPLE_IDP_USER_ERIN_USERNAME: "erin"
      SIMPLE_IDP_USER_ERIN_PASSWORD: "password"
      SIMPLE_IDP_USER_ERIN_NAME: "Erin Fisher"
      SIMPLE_IDP_USER_ERIN_EMAIL: "erin@localhost"
      SIMPLE_IDP_USER_ERIN_GROUPS: "marketing"
      SIMPLE_IDP_USER_FRANK_USERNAME: "frank"
      SIMPLE_IDP_USER_FRANK_PASSWORD: "password"
      SIMPLE_IDP_USER_FRANK_NAME: "Frank Graham"
      SIMPLE_IDP_USER_FRANK_EMAIL: "frank@localhost"
      SIMPLE_IDP_USER_FRANK_GROUPS: "hr"

  postgres:
    extends:
      file: "./compose.base.yaml"
      service: "postgres"
    networks:
      - "internal"
    volumes:
      - { type: "volume", source: "postgres-data", target: "/var/lib/postgresql/" }
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "password"

  postgres-setup:
    extends:
      file: "./compose.base.yaml"
      service: "postgres-setup"
    networks:
      - "internal"
    configs:
      - { source: "postgres-capek.sql", target: "/docker-entrypoint-initdb.d/capek.sql", mode: 0o0644 }
    depends_on:
      postgres:
        condition: "service_healthy"

  playwright-mcp:
    extends:
      file: "./compose.base.yaml"
      service: "playwright-mcp"
    networks:
      - "external"
      - "internal"

configs:
  postgres-capek.sql:
    content: |
      SELECT 'CREATE USER capek PASSWORD ''password'''
      WHERE NOT EXISTS (SELECT FROM pg_user WHERE usename = 'capek')\gexec
      SELECT 'CREATE DATABASE capek WITH OWNER = capek ENCODING = ''UTF8'' TABLESPACE = pg_default'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'capek')\gexec

volumes:
  postgres-data:
    name: "capek-postgres-data"

networks:
  external:
    name: "capek-external"
    internal: false

  internal:
    name: "capek-internal"
    internal: true
