  postgres-capek.sql:
    content: |
      SELECT 'CREATE USER capek PASSWORD ''password'''
      WHERE NOT EXISTS (SELECT FROM pg_user WHERE usename = 'capek')\gexec
      SELECT 'CREATE DATABASE capek WITH OWNER = capek ENCODING = ''UTF8'' TABLESPACE = pg_default'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'capek')\gexec

  postgres-dex.sql:
    content: |
      SELECT 'CREATE USER dex PASSWORD ''password'''
      WHERE NOT EXISTS (SELECT FROM pg_user WHERE usename = 'dex')\gexec
      SELECT 'CREATE DATABASE dex WITH OWNER = dex ENCODING = ''UTF8'' TABLESPACE = pg_default'
      WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'dex')\gexec

volumes:
  postgres-data:
    name: "capek-postgres-data"

networks:
  external:
    name: "capek-external"
    internal: false

  internal:
    name: "capek-internal"
    internal: true
